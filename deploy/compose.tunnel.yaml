# Optional: docker compose -f compose.yaml -f deploy/compose.tunnel.yaml up -d --build
services:
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
secrets:
  tunnel_token:
    file: ./secrets/tunnel-token.txt
