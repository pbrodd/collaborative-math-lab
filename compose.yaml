name: collaborative-math-lab
services:
  app:
    image: collaborative-math-lab:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    init: true
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      AUTH_SETUP_TOKEN: ${AUTH_SETUP_TOKEN:-}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000'
    volumes:
      - lab-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  lab-data:
