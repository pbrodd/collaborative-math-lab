name: Lean proof checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - run: npm run proofs:check
      - uses: actions/upload-artifact@v4
        with:
          name: lean-proof-receipts
          path: |
            verification/generated/Claims.lean
            verification/generated/receipts.json
            verification/generated/axioms.txt
